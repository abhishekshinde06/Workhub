[project]
name = "project-workhub-updated"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chroma>=0.2.0",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "jwt>=1.4.0",
    "langchain>=1.4.3",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langgraph>=1.2.12",
    "psycopg2-binary>=2.9.13",
    "pwdlib[argon2]>=0.3.1",
    "pypdf>=6.19.0",
    "python-dotenv",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
project-workhub-updated = "project_workhub_updated:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
