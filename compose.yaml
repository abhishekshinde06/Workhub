services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://workhub:9630610042@db:5432/workhub_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: workhub
      POSTGRES_PASSWORD: 9630610042
      POSTGRES_DB: workhub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workhub -d workhub_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: